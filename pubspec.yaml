name: orbital_factus
description: "Sistema de cotizaciones y facturación para Orbital Engineering Solutions SAS"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Almacenamiento local
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI y tipografía
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.10

  # Utilidades
  uuid: ^4.3.3
  intl: ^0.19.0

  # PDF
  pdf: ^3.10.8
  printing: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Generador de Hive
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  analyzer: ^6.4.1

  # Generador de iconos
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

# --- ICONOS DE LA APP (Web, Linux, Windows, Android) ---
flutter_launcher_icons:
  android: true
  ios: false                # Desactivado (estás en Linux)
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 256
  linux:
    generate: true
    image_path: "assets/images/app_icon.png"
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21